<!-- SupportDeck mark — minimalist headset.
     Uses currentColor so the host element controls the hue.
     Inlined into Login.tt's circular LoginHero-mark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M5.5 13 V11.5 a6.5 6.5 0 0 1 13 0 v1.5"
          stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="4" y="12.5" width="3" height="5.5" rx="1" fill="currentColor"/>
    <rect x="17" y="12.5" width="3" height="5.5" rx="1" fill="currentColor"/>
    <path d="M18.5 18 V19.5 a1.5 1.5 0 0 1 -1.5 1.5 H13"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
